<!DOCTYPE html>
<html>
<head>
    <title>Phishing Website Detection</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            padding: 40px;
        }
        input {
            width: 300px;
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
        }
        h2 {
            color: #2c3e50;
        }
    </style>
</head>

<body>

<h2>Phishing Website Detection Using Machine Learning</h2>

<form action="/predict" method="post">
    <input type="text" name="f1" placeholder="Feature 1" required><br>
    <input type="text" name="f2" placeholder="Feature 2" required><br>
    <input type="text" name="f3" placeholder="Feature 3" required><br>
    <input type="text" name="f4" placeholder="Feature 4" required><br>
    <input type="text" name="f5" placeholder="Feature 5" required><br><br>
    <button type="submit">Check Website</button>
</form>


<h3>{{ prediction_text }}</h3>
