{% extends 'login_monitor/base.html' %}

{% block content %}

<div class="card" style="
    max-width:550px;
    margin:45px auto;
    padding:40px;
">

    <div style="text-align:center; margin-bottom:30px;">

        <div style="font-size:42px; margin-bottom:10px;">
            🛡️
        </div>

        <h2 style="
            color:#172554;
            font-size:30px;
            margin-bottom:10px;
        ">
            Create Account
        </h2>

        <p style="
            color:#64748b;
            margin:0;
            line-height:1.6;
        ">
            Register to access the Login Behavior Security
            Monitoring System.
        </p>

    </div>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button
            class="btn"
            type="submit"
            style="
                width:100%;
                margin-top:10px;
                font-weight:bold;
            "
        >
            Create Account
        </button>

    </form>


    <div style="
        text-align:center;
        margin-top:25px;
        padding-top:20px;
        border-top:1px solid #e2e8f0;
    ">

        <p style="color:#64748b; margin:0;">

            Already have an account?

            <a
                href="{% url 'login' %}"
                style="
                    color:#2563eb;
                    font-weight:bold;
                    text-decoration:none;
                "
            >
                Login here
            </a>

        </p>

    </div>

</div>

{% endblock %}
