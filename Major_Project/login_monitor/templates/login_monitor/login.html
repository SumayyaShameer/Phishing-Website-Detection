{% extends 'login_monitor/base.html' %}

{% block content %}

<div class="card" style="
    max-width:500px;
    margin:45px auto;
    padding:40px;
">

    <div style="text-align:center; margin-bottom:30px;">

        <div style="font-size:42px; margin-bottom:10px;">
            🔐
        </div>

        <h2 style="
            color:#172554;
            font-size:30px;
            margin-bottom:10px;
        ">
            Secure Login
        </h2>

        <p style="color:#64748b; margin:0;">
            Sign in to access the Login Behavior Security Monitoring System.
        </p>

    </div>


    <form method="POST">

        {% csrf_token %}

        <label style="
            display:block;
            font-weight:bold;
            color:#172554;
            margin-bottom:6px;
        ">
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label style="
            display:block;
            font-weight:bold;
            color:#172554;
            margin-bottom:6px;
        ">
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button
            class="btn"
            type="submit"
            style="
                width:100%;
                margin-top:5px;
                font-weight:bold;
            "
        >
            Login
        </button>

    </form>


    <div style="
        text-align:center;
        margin-top:25px;
        padding-top:20px;
        border-top:1px solid #e2e8f0;
    ">

        <p style="color:#64748b; margin:0;">

            Don't have an account?

            <a
                href="{% url 'register' %}"
                style="
                    color:#2563eb;
                    font-weight:bold;
                    text-decoration:none;
                "
            >
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
